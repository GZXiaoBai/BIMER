<svg viewBox="0 0 980 960" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="980" height="960" fill="#0f172a"/>
  <rect width="980" height="960" fill="url(#grid)"/>

  <text x="32" y="35" fill="#f8fafc" font-size="18" font-weight="700">BIMER V2 · Quality-aware contextual fusion</text>
  <text x="32" y="56" fill="#94a3b8" font-size="9">Frozen encoders · seven emotions · bilingual dialogue · 32/8 contextual windows</text>

  <rect x="30" y="78" width="920" height="116" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="96" fill="#22d3ee" font-size="9" font-weight="600">UTTERANCE INPUTS</text>

  <rect x="30" y="214" width="920" height="126" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="232" fill="#34d399" font-size="9" font-weight="600">FROZEN FEATURE ENCODERS</text>

  <rect x="30" y="360" width="920" height="146" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="378" fill="#a78bfa" font-size="9" font-weight="600">QUALITY-AWARE TOKEN CONSTRUCTION</text>

  <rect x="170" y="530" width="640" height="292" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="184" y="548" fill="#fbbf24" font-size="9" font-weight="600">FUSION AND DIALOGUE CONTEXT</text>

  <!-- connectors behind all components -->
  <path d="M165 170 L165 244" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M490 170 L490 244" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M815 170 L815 244" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <path d="M165 314 L165 394" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 314 L490 394" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M815 314 L815 394" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M165 476 L165 510 L390 510 L390 570" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 476 L490 570" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M815 476 L815 510 L590 510 L590 570" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M865 406 L905 406 L905 605 L700 605" fill="none" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M490 640 L490 674" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M490 744 L490 776" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M490 842 L490 872" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>

  <!-- opaque masks and input boxes -->
  <rect x="65" y="112" width="200" height="58" rx="7" fill="#0f172a"/>
  <rect x="65" y="112" width="200" height="58" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="165" y="136" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Text</text>
  <text x="165" y="153" fill="#94a3b8" font-size="8" text-anchor="middle">human transcript / ASR</text>

  <rect x="390" y="112" width="200" height="58" rx="7" fill="#0f172a"/>
  <rect x="390" y="112" width="200" height="58" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="490" y="136" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Audio</text>
  <text x="490" y="153" fill="#94a3b8" font-size="8" text-anchor="middle">16 kHz mono segment</text>

  <rect x="715" y="112" width="200" height="58" rx="7" fill="#0f172a"/>
  <rect x="715" y="112" width="200" height="58" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="815" y="136" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Video</text>
  <text x="815" y="153" fill="#94a3b8" font-size="8" text-anchor="middle">16 timestamp-aligned frames</text>

  <!-- encoders -->
  <rect x="65" y="244" width="200" height="70" rx="7" fill="#0f172a"/>
  <rect x="65" y="244" width="200" height="70" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="165" y="270" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">XLM-R base</text>
  <text x="165" y="288" fill="#94a3b8" font-size="8" text-anchor="middle">frozen · 768-D · 128 tokens</text>

  <rect x="390" y="244" width="200" height="70" rx="7" fill="#0f172a"/>
  <rect x="390" y="244" width="200" height="70" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="490" y="270" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Wav2Vec2 XLS-R 300M</text>
  <text x="490" y="288" fill="#94a3b8" font-size="8" text-anchor="middle">frozen · 1024-D</text>

  <rect x="715" y="244" width="200" height="70" rx="7" fill="#0f172a"/>
  <rect x="715" y="244" width="200" height="70" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="815" y="270" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">YuNet + R3D-18</text>
  <text x="815" y="288" fill="#94a3b8" font-size="8" text-anchor="middle">face track · frozen · 512-D</text>

  <!-- quality-aware modality tokens -->
  <rect x="60" y="394" width="210" height="82" rx="7" fill="#0f172a"/>
  <rect x="60" y="394" width="210" height="82" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="165" y="418" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Text token · 256-D</text>
  <text x="165" y="437" fill="#94a3b8" font-size="8" text-anchor="middle">source · ASR confidence</text>
  <text x="165" y="453" fill="#94a3b8" font-size="8" text-anchor="middle">valid length · completeness</text>

  <rect x="385" y="394" width="210" height="82" rx="7" fill="#0f172a"/>
  <rect x="385" y="394" width="210" height="82" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="490" y="418" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Audio token · 256-D</text>
  <text x="490" y="437" fill="#94a3b8" font-size="8" text-anchor="middle">duration · RMS energy</text>
  <text x="490" y="453" fill="#94a3b8" font-size="8" text-anchor="middle">speech ratio · clipping ratio</text>

  <rect x="710" y="394" width="210" height="82" rx="7" fill="#0f172a"/>
  <rect x="710" y="394" width="210" height="82" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="815" y="418" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Vision token · 256-D</text>
  <text x="815" y="437" fill="#94a3b8" font-size="8" text-anchor="middle">face / valid-frame ratios</text>
  <text x="815" y="453" fill="#94a3b8" font-size="8" text-anchor="middle">track stability · face area</text>

  <rect x="720" y="545" width="200" height="60" rx="7" fill="#0f172a"/>
  <rect x="720" y="545" width="200" height="60" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="820" y="569" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Conditioning embeddings</text>
  <text x="820" y="587" fill="#94a3b8" font-size="8" text-anchor="middle">modality + language</text>

  <rect x="280" y="570" width="420" height="70" rx="7" fill="#0f172a"/>
  <rect x="280" y="570" width="420" height="70" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="490" y="596" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Masked quality gates + Cross-modal Transformer</text>
  <text x="490" y="615" fill="#94a3b8" font-size="8" text-anchor="middle">hard missing-modality mask · 2 layers · 4 heads · FFN 512</text>

  <rect x="280" y="674" width="420" height="70" rx="7" fill="#0f172a"/>
  <rect x="280" y="674" width="420" height="70" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="490" y="700" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Dialogue context · BiGRU</text>
  <text x="490" y="719" fill="#94a3b8" font-size="8" text-anchor="middle">1 layer · hidden 128 each direction · 32/8 sliding windows</text>

  <rect x="280" y="776" width="420" height="66" rx="7" fill="#0f172a"/>
  <rect x="280" y="776" width="420" height="66" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="490" y="801" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Seven-class classifier + language calibration</text>
  <text x="490" y="820" fill="#94a3b8" font-size="8" text-anchor="middle">raw probabilities · temperature · uncertainty threshold</text>

  <rect x="105" y="872" width="250" height="58" rx="7" fill="#0f172a"/>
  <rect x="105" y="872" width="250" height="58" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="230" y="896" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Utterance predictions</text>
  <text x="230" y="913" fill="#94a3b8" font-size="8" text-anchor="middle">label · confidence · gates · quality</text>

  <rect x="625" y="872" width="250" height="58" rx="7" fill="#0f172a"/>
  <rect x="625" y="872" width="250" height="58" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="750" y="896" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Dialogue-level outputs</text>
  <text x="750" y="913" fill="#94a3b8" font-size="8" text-anchor="middle">timeline · transitions · global distribution</text>

  <path d="M490 842 L490 858 L230 858 L230 872" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <path d="M490 842 L490 858 L750 858 L750 872" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>

  <rect x="30" y="940" width="920" height="1" fill="#334155"/>
  <circle cx="58" cy="949" r="4" fill="#22d3ee"/>
  <text x="70" y="952" fill="#94a3b8" font-size="7">input</text>
  <circle cx="126" cy="949" r="4" fill="#34d399"/>
  <text x="138" y="952" fill="#94a3b8" font-size="7">encoder / output</text>
  <circle cx="247" cy="949" r="4" fill="#a78bfa"/>
  <text x="259" y="952" fill="#94a3b8" font-size="7">quality token</text>
  <circle cx="354" cy="949" r="4" fill="#fbbf24"/>
  <text x="366" y="952" fill="#94a3b8" font-size="7">fusion</text>
</svg>
