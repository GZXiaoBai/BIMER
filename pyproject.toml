[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimer"
version = "0.1.0"
description = "Bilingual multimodal emotion recognition for dialogues"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "torch>=2.6,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
inference = [
  "faster-whisper>=1.1,<2",
  "gradio>=5,<7",
  "transformers>=4.48,<5",
  "opencv-python-headless>=4.10,<5",
  "matplotlib>=3.9,<4",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
bimer = "bimer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

