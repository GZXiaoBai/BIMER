[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimer"
version = "1.1.0"
description = "Bilingual multimodal emotion recognition for dialogues"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=3.0.5,<4",
  "torch>=2.6,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
inference = [
  "faster-whisper>=1.1,<2",
  "gradio>=6.21.0,<7",
  "transformers>=5.5,<6",
  "opencv-python-headless>=5.0.0.93,<6",
  "matplotlib>=3.11.1,<4",
  "pillow>=11,<13",
  "torchvision>=0.21,<1",
]
adaptation = [
  "transformers>=5.5,<6",
  "peft>=0.20.0,<1",
  "accelerate>=1.10,<2",
]
dev = [
  "mypy>=2.3.0,<3",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
bimer = "bimer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bimer"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts", "data", ".tools", ".superpowers"]

[tool.ruff.lint]
select = ["ARG", "B", "C901", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 60

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
